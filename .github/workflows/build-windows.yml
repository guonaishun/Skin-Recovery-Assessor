name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy opencv-python pillow pillow-heif matplotlib scikit-image

      - name: 下载 Three.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path static
          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -OutFile "static/three.min.js"

      - name: PyInstaller 打包
        run: pyinstaller build.spec --clean --noconfirm

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: SkinRecoveryAssessor-Windows
          path: dist/SkinRecoveryAssessor.exe
          retention-days: 30
